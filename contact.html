<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: #f9f9f9;
      font-family: 'Arial', sans-serif;
      line-height: 1.6;
    }
    .contact {
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      color: white;
      padding: 80px 0;
      border-radius: 20px;
    }
    .heading h3 {
      font-size: 2.5rem;
      font-weight: bold;
    }
    .contact-details p, .contact-details i {
      font-size: 1.1rem;
    }
    .contact-details i {
      color: #ffd700;
    }
    .form-control {
      border-radius: 12px;
      padding: 12px;
    }
    .c-btn {
      background: #ffd700;
      color: #4e54c8;
      font-weight: bold;
      transition: background 0.3s ease;
    }
    .c-btn:hover {
      background: #ffcc00;
    }
    @media (max-width: 768px) {
      .heading h3 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

<section class="contact container" id="contact">
  <div class="heading text-center mb-5">
    <small class="d-block mb-2">Get in Touch</small>
    <h3>Any Questions? Feel Free to Contact</h3>
  </div>

  <div class="row justify-content-evenly">
    <div class="col-md-5 col-10 contact-details" data-aos="slide-right">
      <div class="mb-4 d-flex align-items-center">
        <i class="bi bi-geo-alt-fill me-3"></i>
        <p>LPU, 144001, Phagwara</p>
      </div>
      <div class="mb-4 d-flex align-items-center">
        <i class="bi bi-telephone-fill me-3"></i>
        <p>+91 8170091726</p>
      </div>
      <div class="mb-4 d-flex align-items-center">
        <i class="bi bi-send-fill me-3"></i>
        <p>ashishrouniyar270@gmail.com</p>
      </div>
      <div class="d-flex align-items-center">
        <i class="bi bi-globe-americas me-3"></i>
        <p><a href="https://codingashish.com" target="_blank" class="text-white text-decoration-none">codingashish.com</a></p>
      </div>
    </div>

    <div class="col-md-5 col-10 mt-4 mt-md-0" data-aos="slide-left">
      <form action="#" method="post" class="contact-form">
        <div class="mb-3">
          <input type="text" class="form-control" name="name" placeholder="Your Name" required>
        </div>
        <div class="mb-3">
          <input type="email" class="form-control" name="email" placeholder="Your E-mail" required>
        </div>
        <div class="mb-3">
          <input type="text" class="form-control" name="phone" placeholder="Mobile No." required>
        </div>
        <div class="mb-3">
          <textarea class="form-control" name="message" placeholder="Your Message" rows="5" required></textarea>
        </div>
        <button type="submit" class="c-btn btn rounded-pill py-3 px-5">Submit</button>
      </form>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
